<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Products Admin | Vision Center</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
        rel="stylesheet">
</head>

<body class="loading admin-page">

    <!-- Vision Center Page Loader -->
    <div class="loader" id="loader" role="status" aria-label="Loading">
        <div class="loader-card">
            <div class="loader-eye">
                <span class="loader-ring"></span>
                <span class="loader-pupil"></span>
            </div>
            <h2>VISION CENTER</h2>
            <p>Family Eye Care Services</p>
            <div class="loader-bar"><i></i></div>
        </div>
    </div>

    <header class="admin-top"><a class="brand" href="../index.html"><img class="brand-mark" src="../images/logo2.png"
                alt=""><span><b>Vision Center</b><small>Private product management</small></span></a><a
            href="../products.html">View public catalog ↗</a></header>
    <main class="admin-shell">
        <section id="loginPanel" class="admin-card login-card"><span class="eyebrow">AUTHORIZED STAFF ONLY</span>
            <h1>Admin Login</h1>
            <p>Sign in with the administrator account.</p>
            <form id="loginForm"><label>Email<input type="email" name="email" autocomplete="username"
                        required></label><label>Password<input type="password" name="password"
                        autocomplete="current-password" required></label><button class="btn btn-primary"
                    type="submit">Sign in →</button>
                <p id="loginMessage" class="admin-message" role="status"></p>
            </form>
        </section>
        <section id="managePanel" class="admin-card" hidden>
            <div class="admin-heading">
                <div><span class="eyebrow">PRODUCT INVENTORY</span>
                    <h1>Manage Products</h1>
                    <p id="adminWelcome"></p>
                </div><button id="logoutBtn" class="btn btn-outline">Sign out</button>
            </div>
            <div class="admin-layout">
                <form id="productForm" class="product-form">
                    <h2 id="formTitle">Add a product</h2><input type="hidden" name="id"><label>Product name<input
                            name="name" required maxlength="100"></label><label>Category<select name="category"
                            required>
                            <option value="Frames">Frames</option>
                            <option value="Sunglasses">Sunglasses</option>
                            <option value="Lenses">Lenses</option>
                            <option value="Accessories">Accessories</option>
                        </select></label><label>Price (LKR)<input name="price" type="number" min="0" step="1"
                            placeholder="Leave blank for price on request"></label><label>Description<textarea
                            name="description" rows="3" maxlength="500"></textarea></label><label>Product photo<input
                            id="imageFile" type="file" accept="image/jpeg,image/png,image/webp"></label>
                    <div id="uploadStatus" class="admin-message"></div><label class="checkbox-label"><input
                            name="active" type="checkbox" checked> Show on public products page</label><button
                        class="btn btn-primary" type="submit" id="saveProduct">Save product</button><button
                        class="btn btn-outline" type="button" id="cancelEdit" hidden>Cancel edit</button>
                    <p id="productMessage" class="admin-message" role="status"></p>
                </form>
                <div class="inventory">
                    <div class="inventory-title">
                        <h2>Products</h2><input id="adminSearch" type="search" placeholder="Search inventory…">
                    </div>
                    <div id="adminProductList">
                        <p>Loading inventory…</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="../js/page-effects.js"></script>
    <script type="module" src="../js/admin.js"></script>
</body>

</html>
